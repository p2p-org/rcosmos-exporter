name: CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Collect test env files
        id: collect
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'test/env';
            let include = [];
            if (fs.existsSync(dir)) {
              for (const f of fs.readdirSync(dir)) {
                if (f.endsWith('.yaml') || f.endsWith('.yml')) {
                  include.push({ env_file: path.posix.join(dir, f), env_name: path.parse(f).name });
                }
              }
            }
            if (include.length === 0) {
              core.setFailed('No env files found in test/env');
            }
            core.setOutput('matrix', JSON.stringify({ include }));

  build-binary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Build release binary
        run: |
          cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rcosmos-exporter-bin
          path: target/release/rcosmos-exporter
          if-no-files-found: error

  test-env:
    name: Test ${{ matrix.env_name }}
    runs-on: ubuntu-latest
    needs: [generate-matrix, build-binary]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Download binary artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rcosmos-exporter-bin
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/rcosmos-exporter

      - name: Show matrix entry
        run: |
          echo "Testing env: ${{ matrix.env_file }} (name: ${{ matrix.env_name }})"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyyaml

      - name: Run test-envs.sh for single env
        env:
          # Give each job its own ClickHouse port namespace and project name if desired
          CLICKHOUSE_URL: http://localhost:18123
          CLICKHOUSE_DATABASE: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: mysecurepassword123
          NODE_NAME: rcosmos-exporter-test
          PREBUILT: "1"
        run: |
          chmod +x ./test/test-envs.sh
          ./test/test-envs.sh "${{ matrix.env_file }}"

  ci-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [generate-matrix, build-binary, test-env]
    if: always()
    steps:
      - name: Check all test jobs passed
        run: |
          if [ "${{ needs.test-env.result }}" != "success" ]; then
            echo "❌ One or more test jobs failed"
            exit 1
          fi
          echo "✅ All tests passed!"
